name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  test:
    name: Test packages
    runs-on: ubuntu-26.04
    # The job only reads the repository and the latest Spice release
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install package dependencies
        # Libraries that the binding packages link against
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libcurl4-openssl-dev libsqlite3-dev

      - name: Install Spice
        # The release archive ships the compiler and the std, which the compiler finds via SPICE_STD_DIR
        run: |
          SPICE_DIR="$RUNNER_TOOL_CACHE/spice"
          mkdir -p "$SPICE_DIR"
          curl -fsSL https://github.com/spicelang/spice/releases/latest/download/spice_linux_amd64.tar.gz | tar xz -C "$SPICE_DIR"
          echo "$SPICE_DIR" >> "$GITHUB_PATH"
          echo "SPICE_STD_DIR=$SPICE_DIR/std" >> "$GITHUB_ENV"
          "$SPICE_DIR/spice" --version

      - name: Run tests
        # Tests every package with the entry file of its spice.toml. All packages are tested, even if one of them fails.
        # The llvm package is tested by the test-llvm job, because it needs an LLVM build
        run: |
          failed=()
          for manifest in packages/*/spice.toml; do
            dir=$(dirname "$manifest")
            if [ "$dir" = "packages/llvm" ]; then
              continue
            fi
            entry=$(sed -n 's/^entry *= *"\(.*\)"/\1/p' "$manifest")
            echo "::group::$(basename "$dir")"
            if ! (cd "$dir" && spice test -O0 "$entry"); then
              failed+=("$(basename "$dir")")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Tests failed for: ${failed[*]}"
            exit 1
          fi

  test-llvm:
    name: Test llvm package
    runs-on: ubuntu-26.04
    # The job only reads the repository, the latest Spice release and LLVM
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install package dependencies
        # Ninja for the LLVM build, the libraries that the llvm package links besides LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libzstd-dev libtinfo-dev uuid-dev

      - name: Setup LLVM
        # The action of the Spice repository builds the LLVM version, that the compiler and the bindings target, and exports
        # LLVM_LIB_DIR and LLVM_INCLUDE_DIRS. The build is cached, so only the first run after an LLVM bump builds LLVM
        uses: spicelang/spice/.github/actions/setup-llvm@main
        with:
          cache-key-suffix: linux-x64
          use-ccache: "false"

      - name: Install Spice
        # The release archive ships the compiler and the std, which the compiler finds via SPICE_STD_DIR
        run: |
          SPICE_DIR="$RUNNER_TOOL_CACHE/spice"
          mkdir -p "$SPICE_DIR"
          curl -fsSL https://github.com/spicelang/spice/releases/latest/download/spice_linux_amd64.tar.gz | tar xz -C "$SPICE_DIR"
          echo "$SPICE_DIR" >> "$GITHUB_PATH"
          echo "SPICE_STD_DIR=$SPICE_DIR/std" >> "$GITHUB_ENV"
          "$SPICE_DIR/spice" --version

      - name: Run tests
        working-directory: packages/llvm
        run: spice test -O0 llvm.spice
