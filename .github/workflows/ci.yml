name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly run of all packages, to catch breakages by a new Spice release in packages that did not change
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compute test matrix
        # Selects the changed packages and their dependents, with the requirements from their ci.toml files. Changes to
        # this workflow or the script, scheduled and manual runs test all packages
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          # On a pull request, the first parent of the merge commit is the tip of the base branch
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: python3 .github/scripts/plan.py

  test:
    name: Test ${{ matrix.name }}
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      # All packages are tested, even if one of them fails
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install APT packages
        if: join(matrix.apt, ' ') != ''
        env:
          APT_PACKAGES: ${{ join(matrix.apt, ' ') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y $APT_PACKAGES

      # Named setup steps, that a package requests with `setup = [...]` in its ci.toml. A new one needs to be added to
      # KNOWN_SETUP_STEPS in .github/scripts/plan.py as well

      - name: Setup LLVM
        # The action of the Spice repository builds the LLVM version, that the compiler and the bindings target, and exports
        # LLVM_LIB_DIR and LLVM_INCLUDE_DIRS. The build is cached, so only the first run after an LLVM bump builds LLVM
        if: contains(matrix.setup, 'llvm')
        uses: spicelang/spice/.github/actions/setup-llvm@main
        with:
          cache-key-suffix: linux-x64
          use-ccache: "false"

      - name: Install package dependencies
        # The packages of this repository, that the package depends on, are installed from the checkout instead of the
        # registry, so that a change to a dependency is tested with its dependents. All of them go flat into the
        # spice_packages dir of the package, like Spice Shaker installs them. They are copied, because the compiler does
        # not follow symbolic links out of the dir of the main source file
        if: join(matrix.deps, ' ') != ''
        env:
          PACKAGE: ${{ matrix.name }}
          DEPS: ${{ join(matrix.deps, ' ') }}
        run: |
          mkdir -p "packages/$PACKAGE/spice_packages"
          for dep in $DEPS; do
            cp -r "packages/$dep" "packages/$PACKAGE/spice_packages/$dep"
          done

      - name: Setup Spice
        uses: spicelang/spice-setup-action@v1

      - name: Run tests
        # The entry file, or the files that the package lists as `tests` in its ci.toml (e.g. a module, that imports the entry
        # file, to run the tests of both)
        working-directory: packages/${{ matrix.name }}
        env:
          TEST_FILES: ${{ join(matrix.tests, ' ') }}
        run: |
          for file in $TEST_FILES; do
            spice test -O0 "$file"
          done

  result:
    # Stable check for the branch protection, because the test jobs are named after the packages and skipped if no package
    # changed
    name: CI result
    needs: [detect, test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check results
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "detect: $DETECT_RESULT, test: $TEST_RESULT"
          if [ "$DETECT_RESULT" != "success" ] || [ "$TEST_RESULT" = "failure" ] || [ "$TEST_RESULT" = "cancelled" ]; then
            exit 1
          fi
